name: TEST

on:
    pull_request:
        branches: [develop]
        paths-ignore:
            - 'docs/**'
            - '**/*.md'
    workflow_call:

# Cancel superseded runs of a pull request. BUILD calls this workflow for
# pushes; those runs get a unique group, so they never queue or cancel.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

    unit-test:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Nx skips the tests when their inputs match a cached run.
            - name: Cache nx build cache
              uses: actions/cache@v5
              with:
                  path: .nx/cache
                  key: ${{ runner.os }}-nx-test-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-nx-test-

            - name: Setup version
              run: bun run postinstall

            - name: Unit tests
              run: bun run test:ci

    e2e-test:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            # Pull requests to develop and pushes to develop run Chromium only.
            # Other branches run every browser.
            CHROMIUM_ONLY: ${{ github.base_ref == 'develop' || github.ref == 'refs/heads/develop' }}
        steps:
            - uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Setup version
              run: bun run postinstall

            # A browser cache saves no time here: a hit still installs the
            # system packages, and a restore takes about as long as a download.
            - name: Install Playwright browsers
              run: bunx playwright install --with-deps ${{ env.CHROMIUM_ONLY == 'true' && 'chromium' || '' }}

            - name: Run E2E tests
              run: bunx nx e2e e2e ${{ env.CHROMIUM_ONLY == 'true' && '-- --project=chromium --project=mobile-chrome' || '' }}

            - name: Upload Playwright report
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

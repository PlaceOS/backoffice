name: TEST

on:
    pull_request:
        branches: [develop]
    workflow_call:

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - uses: actions/checkout@v4

            - name: Cache Bun dependencies
              id: cache
              uses: actions/cache@v5
              with:
                  path: |
                      node_modules
                      ~/.bun/install/cache
                  key: ${{ runner.os }}-build-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-build-

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

    unit-test:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6

            - name: Cache Bun dependencies
              id: cache
              uses: actions/cache@v5
              with:
                  path: |
                      node_modules
                      ~/.bun/install/cache
                  key: ${{ runner.os }}-build-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-build-

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: bun install --frozen-lockfile

            - name: Cache nx build cache
              id: cache-nx
              uses: actions/cache@v5
              with:
                  path: node_modules/.cache/nx
                  key: ${{ runner.os }}-nx-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-nx-

            - name: Setup version
              run: bun run postinstall

            - name: Unit tests
              run: bun run test:ci

    e2e-test:
        runs-on: ubuntu-latest
        timeout-minutes: 18
        steps:
            - uses: actions/checkout@v6

            - name: Cache Bun dependencies
              id: cache
              uses: actions/cache@v5
              with:
                  path: |
                      node_modules
                      ~/.bun/install/cache
                  key: ${{ runner.os }}-build-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-build-

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.11'

            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: bun install --frozen-lockfile

            - name: Cache nx build cache
              id: cache-nx
              uses: actions/cache@v5
              with:
                  path: node_modules/.cache/nx
                  key: ${{ runner.os }}-nx-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-nx-

            - name: Setup version
              run: bun run postinstall

            - name: Install Playwright browsers
              run: bunx playwright install --with-deps

            - name: Run E2E tests
              run: bunx nx e2e e2e ${{ (github.base_ref == 'develop' || github.ref == 'refs/heads/develop') && '-- --project=chromium --project=mobile-chrome' || '' }}

            - name: Upload Playwright report
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

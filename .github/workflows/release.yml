# Releases backoffice with each PlaceOS platform release. See docs/releases.md.
#
# The release ships the backoffice commit that the interfaces/backoffice
# submodule of PlaceOS/PlaceOS pins for that version. The workflow tags it
# v<version>, tests it, builds it and publishes it to build/prod. PlaceOS
# installs load backoffice from build/prod.
name: RELEASE

on:
    # Sent by the "Tag and release" job of build.yml in PlaceOS/PlaceOS, with
    # the payload { "version": "2.2611.6" }
    repository_dispatch:
        types: [placeos-release]
    # To retry a release, or to roll back to an earlier version
    workflow_dispatch:
        inputs:
            version:
                description: 'PlaceOS version, for example 2.2611.6'
                required: true
                type: string

permissions:
    contents: write

# One release at a time. A release that starts during a release waits.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    resolve:
        runs-on: ubuntu-latest
        timeout-minutes: 2
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}
            tag: ${{ steps.resolve.outputs.tag }}
        steps:
            - name: Find the backoffice commit that the PlaceOS version pins
              id: resolve
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ github.event.client_payload.version || inputs.version }}
              run: |
                  if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]{4}\.[0-9]+$ ]]; then
                      echo "::error::The version is not a PlaceOS release version, for example 2.2611.6"
                      exit 1
                  fi

                  sha="$(gh api "repos/PlaceOS/PlaceOS/contents/interfaces/backoffice?ref=${VERSION}" --jq .sha)"
                  if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "::error::PlaceOS ${VERSION} does not pin a backoffice commit"
                      exit 1
                  fi

                  # A retry can use the tag again. A tag on a different commit stops the release.
                  tag="v${VERSION}"
                  tagged="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${tag}" | cut -f1)"
                  if [[ -n "$tagged" && "$tagged" != "$sha" ]]; then
                      echo "::error::${tag} is on ${tagged}. PlaceOS ${VERSION} pins ${sha}"
                      exit 1
                  fi

                  echo "Releasing ${sha} as ${tag}"
                  echo "sha=${sha}" >> "$GITHUB_OUTPUT"
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"

    test:
        needs: [resolve]
        permissions:
            contents: read
        uses: ./.github/workflows/test.yml
        with:
            ref: ${{ needs.resolve.outputs.sha }}

    build:
        needs: [resolve]
        permissions:
            contents: read
        uses: ./.github/workflows/build-app.yml
        with:
            ref: ${{ needs.resolve.outputs.sha }}
            configuration: production
            tag: ${{ needs.resolve.outputs.tag }}
        secrets: inherit

    # Publish only after the tests pass
    publish:
        needs: [resolve, test, build]
        runs-on: ubuntu-latest
        timeout-minutes: 3
        env:
            SHA: ${{ needs.resolve.outputs.sha }}
            TAG: ${{ needs.resolve.outputs.tag }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.resolve.outputs.sha }}

            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: build-output
                  path: dist/backoffice/browser

            # Vercel reads vercel.json from the pushed commit. Build branches
            # hold only the built files, so add one that turns off deployments.
            - name: Turn off Vercel deployments for the build branch
              run: |
                  echo '{ "git": { "deploymentEnabled": false } }' > dist/backoffice/browser/vercel.json

            - name: Deploy the application
              uses: MrYuion/git-publish-subdir-action@develop
              env:
                  REPO: self
                  BRANCH: build/prod
                  FOLDER: dist/backoffice/browser
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MESSAGE: 'build(backoffice): ${{ needs.resolve.outputs.tag }} from {sha}'

            # Pushes nothing when a retry already pushed the tag
            - name: Push the release tag
              run: git push origin "${SHA}:refs/tags/${TAG}"

            - name: Update Pipeline Chat Status
              uses: fjogeleit/http-request-action@master
              continue-on-error: true
              with:
                  url: ${{ secrets.STATUS_URL }}
                  data: '{ "name": "${{ github.repository }}", "commit": "${{ needs.resolve.outputs.sha }}", "pipeline_name": "backoffice", "branch": "build/prod", "status": "${{ job.status }}", "url": "https://github.com/${{ github.repository }}/runs/${{ github.run_id }}" }'
              if: ${{ always() }}

    # A separate job, so that a failed push to develop does not show as a failed
    # deploy. Re-run this job alone to retry it.
    changelog:
        needs: [resolve, publish]
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: develop

            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: build-output
                  path: ${{ runner.temp }}/build

            - name: Commit the changelog to develop
              env:
                  TAG: ${{ needs.resolve.outputs.tag }}
              run: |
                  # A rollback has an older changelog. Keep the newer one.
                  newest="$(git ls-remote --tags origin | cut -f2 | sed 's|^refs/tags/||' \
                      | grep -E '^v[0-9]+\.[0-9]{4}\.[0-9]+$' | sort -V | tail -1)"
                  if [[ "$newest" != "$TAG" ]]; then
                      echo "${newest} is newer than ${TAG}. CHANGELOG.md stays the same."
                      exit 0
                  fi

                  cp "${RUNNER_TEMP}/build/CHANGELOG.md" CHANGELOG.md
                  git add CHANGELOG.md
                  if git diff --cached --quiet; then
                      echo "CHANGELOG.md is already up to date."
                      exit 0
                  fi

                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git commit -m "docs(changelog): update for ${TAG}"
                  git push origin HEAD:develop

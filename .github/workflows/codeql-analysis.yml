name: "Code scanning - action"

on:
  # Pull requests are scanned by the pull_request trigger. Match the BUILD
  # branches so that a pull request push is not scanned twice.
  push:
    branches: [develop, release/**, rc/**, release]
  pull_request:
  schedule:
    - cron: '0 10 * * 4'

jobs:
  CodeQL-Build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # We must fetch at least the immediate parents so that if this is
        # a pull request then we can checkout the head.
        fetch-depth: 2

    # If this run was triggered by a pull request event, then checkout
    # the head of the pull request instead of the merge commit.
    - run: git checkout HEAD^2
      if: ${{ github.event_name == 'pull_request' }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3

    # JavaScript and TypeScript extraction reads the source files only, so the
    # dependencies are not installed.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

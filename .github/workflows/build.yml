# Builds develop and publishes it to build/dev. PlaceOS releases publish to
# build/prod through RELEASE (release.yml). See docs/releases.md.
name: BUILD

on:
    push:
        branches: [develop]

permissions:
    contents: read

jobs:
    # Tests run in parallel with the build. The dev deploy does not wait for them.
    test:
        uses: ./.github/workflows/test.yml

    build:
        uses: ./.github/workflows/build-app.yml
        with:
            configuration: development
        secrets: inherit

    deploy-dev:
        needs: [build]
        # Pushes to build/dev
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - uses: actions/checkout@v6

            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: build-output
                  path: dist/backoffice/browser

            # Vercel reads vercel.json from the pushed commit. Build branches
            # hold only the built files, so add one that turns off deployments.
            - name: Turn off Vercel deployments for the build branch
              run: |
                  echo '{ "git": { "deploymentEnabled": false } }' > dist/backoffice/browser/vercel.json

            - name: Deploy the application
              uses: MrYuion/git-publish-subdir-action@develop
              env:
                  REPO: self
                  BRANCH: build/dev
                  FOLDER: dist/backoffice/browser
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MESSAGE: 'build(backoffice): [{sha}] CI build'

            - name: Update Pipeline Chat Status
              uses: fjogeleit/http-request-action@master
              continue-on-error: true
              with:
                  url: ${{ secrets.STATUS_URL }}
                  data: '{ "name": "${{ github.repository }}", "commit": "${{ github.sha }}", "pipeline_name": "backoffice", "branch": "${{ github.ref }}", "status": "${{ job.status }}", "url": "https://github.com/${{ github.repository }}/runs/${{ github.run_id }}" }'
              if: ${{ always() }}

<header class="flex items-center justify-between space-x-2">
    <h3 class="text-xl">
        Module State - {{module?.custom_name || module?.name}}
    </h3>
    <button btn icon mat-dialog-close>
        <app-icon>close</app-icon>
    </button>
</header>
<main class="w-[80vw] p-4 space-y-2" *ngIf="!loading; else load_state">
    <div class="flex items-center space-x-2 hover:bg-base-200 p-2 rounded">
        <label class="w-16 m-0">System:</label>
        <div class="mono">{{system?.display_name || system?.name}}</div>
    </div>
    <div class="flex items-center space-x-2 hover:bg-base-200 p-2 rounded">
        <label class="w-16 m-0">Module:</label>
        <div class="mono">{{ device_classes[module?.id] }}</div>
    </div>
    <button btn matRipple class="w-32" (click)="updateState()">
        Update state
    </button>
    <div class="settings">
        <settings-form-field
            [ngModel]="state"
            [readonly]="true"
        ></settings-form-field>
    </div>
</main>
<ng-template #load_state>
    <main class="">
        <div class="info-block">
            <div class="icon">
                <mat-spinner diameter="32"></mat-spinner>
            </div>
            <div class="text">Loading state...</div>
        </div>
    </main>
</ng-template>

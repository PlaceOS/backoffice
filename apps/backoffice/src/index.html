<!doctype html>
<html lang="en" id="placeos">
    <head>
        <meta charset="utf-8" />
        <title>Backoffice</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="theme-color" content="#1976d2" />
        <link
            rel="preload"
            href="./assets/material-symbols-rounded.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="./assets/material-symbols.css" />
        <link rel="stylesheet" href="./assets/firacode/fira_code.css" />
    </head>
    <body>
        <placeos-root></placeos-root>
        <noscript>
            Please enable JavaScript to continue using this application.
        </noscript>
        <script src="assets/monaco/min/vs/loader.js"></script>
        <script>
            require.config({
                paths: {
                    vs:
                        location.origin +
                        location.pathname +
                        'assets/monaco/min/vs',
                },
            });
            require(['vs/editor/editor.main'], function () {});
        </script>
    </body>
</html>
